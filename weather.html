<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Now</title>
  <link rel="preconnect" href="https://cdn.weatherapi.com" crossorigin>
  <style>
    :root{
      --bg:#0f172a;
      --card:#111827cc;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --accent:#22d3ee;
      --danger:#f87171;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:radial-gradient(1200px 900px at 10% -10%, #0ea5e9 0%, transparent 50%),
                 radial-gradient(1000px 800px at 110% 10%, #22c55e 0%, transparent 45%),
                 var(--bg);
      color:var(--text);
      display:grid;
      place-items:center;
      padding:24px;
    }
    .app{
      width:100%;
      max-width:720px;
      background:linear-gradient(180deg, #00000066, #00000022);
      backdrop-filter:blur(8px);
      border:1px solid #ffffff22;
      border-radius:24px;
      box-shadow:0 10px 35px #00000066;
      padding:20px;
    }
    .row{display:flex;gap:12px;flex-wrap:wrap}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    h1{font-size:1.25rem;margin:0;font-weight:700}
    .search{display:flex;gap:10px;flex:1}
    .search input{
      flex:1;
      min-width:220px;
      background:#0b1220;
      border:1px solid #334155;
      border-radius:14px;
      padding:12px 14px;
      color:var(--text);
      outline:none
    }
    .search input::placeholder{color:#64748b}
    button{
      background:var(--accent);
      color:#0b1220;
      border:none;
      border-radius:14px;
      padding:12px 14px;
      font-weight:700;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px
    }
    button:disabled{opacity:.6;cursor:not-allowed}
    .ghost{background:#1f2937;color:var(--text);border:1px solid #374151}

    .card{
      background:var(--card);
      border:1px solid #ffffff18;
      border-radius:20px;
      padding:18px;
      margin-top:14px;
    }
    .muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:12px}
    @media (min-width:640px){.grid{grid-template-columns:repeat(4, minmax(0,1fr));}}

    .big{display:flex;align-items:center;gap:16px}
    .temp{font-size:3.5rem;line-height:1;font-weight:800}
    .sup{font-size:1rem;vertical-align:super;margin-left:4px}

    .alert{
      margin-top:14px;
      background-color:#fee2e2;
      color:#b91c1c;
      border:1px solid #f87171;
      border-radius:10px;
      padding:10px 14px;
      font-weight:600;
      display:none;
    }
    .alert[hidden]{display:none}

    .forecast{
      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:10px;
      margin-top:16px;
    }
    .day-card{
      flex:1 1 calc(20% - 10px);
      background:#1e293b;
      border:1px solid #334155;
      border-radius:12px;
      padding:10px;
      text-align:center;
    }
    .day-card img{width:48px;height:48px}
    .footer{margin-top:10px;font-size:.85rem}
    a{color:var(--accent);text-decoration:none}
    .spinner{width:18px;height:18px;border-radius:50%;border:3px solid #ffffff55;border-top-color:#fff;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="app" role="main">
    <header>
      <h1>Weather Now</h1>
      <div class="muted">Powered by WeatherAPI</div>
    </header>

    <div class="row">
      <form id="form" class="search" autocomplete="off">
        <input id="q" name="q" placeholder="Enter city or 'lat,lon'" required />
        <button id="searchBtn" type="submit">
          <span id="searchText">Search</span>
        </button>
      </form>
      <button id="geoBtn" class="ghost" title="Use my location">Use my location</button>
    </div>

    <div id="error" class="alert" role="alert" hidden></div>

    <section id="result" class="card" aria-live="polite">
      <div class="muted">Search a location to see the weather.</div>
    </section>

    <div class="footer muted">
      Tip: press <kbd>Enter</kbd> after typing a location.
    </div>
  </main>

  <script>
    const API_KEY = 'bdf9f9e6750b446f9d144338252408';
    const BASE = 'https://api.weatherapi.com/v1/forecast.json';

    const form = document.getElementById('form');
    const input = document.getElementById('q');
    const result = document.getElementById('result');
    const errEl = document.getElementById('error');
    const searchBtn = document.getElementById('searchBtn');
    const searchText = document.getElementById('searchText');
    const geoBtn = document.getElementById('geoBtn');

    function setLoading(isLoading){
      if(isLoading){
        searchBtn.disabled = true;
        searchText.innerHTML = '<span class="spinner"></span>';
      }else{
        searchBtn.disabled = false;
        searchText.textContent = 'Search';
      }
    }

    function showError(msg){
      if(msg){
        errEl.textContent = msg;
        errEl.hidden = false;
        errEl.style.display = 'block';
      }else{
        errEl.hidden = true;
        errEl.style.display = 'none';
      }
    }

    async function fetchWeather(query){
      setLoading(true); showError('');
      try{
        const url = new URL(BASE);
        url.searchParams.set('key', API_KEY);
        url.searchParams.set('q', query);
        url.searchParams.set('days', '5');
        url.searchParams.set('aqi', 'yes');
        const res = await fetch(url);
        if(!res.ok) throw new Error('Request failed');
        const data = await res.json();
        renderWeather(data);
      }catch(e){
        console.error(e);
        showError('⚠️ Could not fetch weather. Please check the location and try again.');
      }finally{
        setLoading(false);
      }
    }

    function renderWeather(d){
      if(!d || !d.location || !d.current){
        result.innerHTML = '<div class="muted">No data available.</div>';
        return;
      }
      const loc = d.location;
      const c = d.current;
      const localTime = loc.localtime || '';
      const tempC = Math.round(c.temp_c);
      let tempNote = tempC > 30 ? "🔥 Very Hot" : tempC < 20 ? "❄ Very Cold" : "🌤 Pleasant";

      let forecastHTML = '';
      if(d.forecast && d.forecast.forecastday){
        forecastHTML = '<h3>5-Day Forecast</h3><div class="forecast">';
        d.forecast.forecastday.forEach(day=>{
          forecastHTML += `
            <div class="day-card">
              <div><strong>${new Date(day.date).toLocaleDateString('en-US',{weekday:'short'})}</strong></div>
              <img src="https:${day.day.condition.icon}" alt="${day.day.condition.text}" />
              <div>${Math.round(day.day.maxtemp_c)}° / ${Math.round(day.day.mintemp_c)}°C</div>
              <div class="muted" style="font-size:.8rem">${day.day.condition.text}</div>
            </div>
          `;
        });
        forecastHTML += '</div>';
      }

      result.innerHTML = `
        <div class="big">
          <img src="https:${c.condition.icon}" alt="${c.condition.text}" width="72" height="72" />
          <div>
            <div class="temp">${tempC}<span class="sup">°C</span></div>
            <div class="muted">Feels like ${Math.round(c.feelslike_c)}°C • ${c.condition.text}</div>
            <div><strong>${tempNote}</strong></div>
          </div>
        </div>

        <div class="row" style="margin-top:12px;flex-wrap:wrap;gap:10px">
          <div class="muted">${loc.name}, ${loc.country}</div>
          <div class="muted">Local time: ${localTime}</div>
        </div>

        <div class="grid card">
          <div><div class="muted">Humidity</div><div><strong>${c.humidity}%</strong></div></div>
          <div><div class="muted">Wind</div><div><strong>${c.wind_kph} kph</strong> ${c.wind_dir}</div></div>
          <div><div class="muted">UV Index</div><div><strong>${c.uv}</strong></div></div>
          <div><div class="muted">AQI (PM2.5)</div><div><strong>${c.air_quality?.pm2_5?.toFixed(1) ?? '—'}</strong></div></div>
        </div>

        ${forecastHTML}
      `;
    }

    form.addEventListener('submit', e=>{
      e.preventDefault();
      const q = input.value.trim();
      if(q) fetchWeather(q);
    });

    geoBtn.addEventListener('click', ()=>{
      if(!('geolocation' in navigator)){
        showError('Geolocation not supported.');
        return;
      }
      setLoading(true); showError('');
      navigator.geolocation.getCurrentPosition(pos=>{
        const { latitude, longitude } = pos.coords;
        fetchWeather(`${latitude.toFixed(2)},${longitude.toFixed(2)}`);
      }, err=>{
        console.warn(err);
        setLoading(false);
        showError('Could not get your location. Please type a city instead.');
      });
    });
  </script>
</body>
</html>
